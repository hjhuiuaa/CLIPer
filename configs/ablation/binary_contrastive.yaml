# Ablation: binary SupCon, linker (2) versus all other residues.
stage: stage7
backbone_name: /data/huggs/hujh/CLIPer/models/Rostlab-ProstT5
window_size: 1024
batch_tokens: 2048
optimizer: adamw
lr: 0.0002
weight_decay: 0.01
max_epochs: 15
early_stop_patience: 3
early_stop_metric: auroc_t1
early_stop_min_delta: 0.002
max_train_val_auroc_gap: 0.06
seed: 42
threshold_search:
  min: 0.05
  max: 0.95
  step: 0.05
dropout: 0.2
freeze_backbone: true
eval_stride: 512
top_k_heuristic: 4
num_workers: 0
device: cuda
local_context:
  enabled: true
  radius: 1
  mode: concat_window
  include_self: true
classifier_head:
  type: crnn
  dropout: 0.5
  activation: relu
  conv_channels:
  - 128
  kernel_size: 3
  dilations:
  - 1
  rnn_hidden_size: 64
  rnn_num_layers: 1
  rnn_type: gru
  bidirectional: true
  num_classes: 1
  linker_class: 2
  dual_binary: false
contrastive:
  enabled: true
  mode: binary
  weight: 0.2
  neg_weight: 0.0
  temperature: 0.1
  proj_dim: 128
  max_samples_per_class: 256
train_fasta: dataset/t2_seqneg/train_val.fasta
caid_fasta: dataset/t2_seqneg/test_caid3.fasta
error_file: dataset/t2_seqneg/error.txt
split_manifest: artifacts/splits/t2_seqneg_split_seed42.json
auto_rebuild_split_on_mismatch: false
experiment_prefix: exp
save_every: 500
print_every: 20
eval_every: 200
auto_start_tensorboard: false
tensorboard_host: 0.0.0.0
tensorboard_port: 6006
use_wandb: false
wandb_entity: 3151599052-nankai-university
wandb_project: CLIPer
wandb_mode: online
wandb_run_name: ablation_binary_contrastive
output_dir: artifacts/runs/ablation_binary_contrastive
wandb_group: ablation_contrastive
wandb_tags:
- ablation
- binary_contrastive
